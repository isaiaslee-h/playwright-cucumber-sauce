name: Playwright Cucumber Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows you to run the test manually from the GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      # npm ci is faster and more reliable for CI environments than npm install
      run: npm ci

    - name: Install Playwright Browsers & OS Dependencies
      run: npx playwright install --with-deps

    - name: Run Cucumber Tests
      run: npx cucumber-js

    - name: Upload Test Report
      # The if: always() ensures the report uploads even if a test fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-html-report
        path: reports/
        retention-days: 14